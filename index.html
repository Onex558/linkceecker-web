<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Link Checker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #102318 0%, #070b08 45%, #050705 100%);
    color: #eafff1;
    font-family: Arial, Helvetica, sans-serif;
}

header {
    padding: 35px 20px;
    text-align: center;
    border-bottom: 1px solid #1c3d28;
    background: rgba(7, 12, 9, .9);
}

.logo {
    font-size: 38px;
    font-weight: 900;
    color: #39ff88;
    letter-spacing: 1px;
}

.subtitle {
    color: #829889;
    margin-top: 8px;
}

.container {
    width: min(1100px, calc(100% - 30px));
    margin: 30px auto;
}

.card {
    background: rgba(12, 20, 15, .95);
    border: 1px solid #1b3d27;
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 10px 35px rgba(0,0,0,.25);
}

h2 {
    margin-top: 0;
}

textarea {
    width: 100%;
    min-height: 220px;
    resize: vertical;

    background: #060a07;
    color: #effff5;

    border: 1px solid #285438;
    border-radius: 11px;

    padding: 16px;
    outline: none;

    font-family: Consolas, monospace;
    font-size: 14px;
}

textarea:focus {
    border-color: #39ff88;
    box-shadow: 0 0 0 2px rgba(57,255,136,.08);
}

.buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 15px;
}

button {
    border: 0;
    border-radius: 9px;
    padding: 12px 19px;
    font-weight: 700;
    cursor: pointer;
}

.primary {
    background: #39ff88;
    color: #061009;
}

.secondary {
    background: #17231b;
    color: #d9e8de;
    border: 1px solid #2b4a35;
}

button:hover {
    filter: brightness(1.1);
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.status {
    margin-top: 15px;
    color: #83988a;
    font-size: 14px;
}

.progress {
    display: none;
    margin-top: 14px;
    width: 100%;
    height: 7px;
    border-radius: 20px;
    overflow: hidden;
    background: #152019;
}

.progress-bar {
    width: 0%;
    height: 100%;
    background: #39ff88;
    transition: width .25s;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.stat {
    background: #080e0a;
    border: 1px solid #1b3825;
    border-radius: 12px;
    padding: 17px;
    text-align: center;
}

.number {
    font-size: 28px;
    font-weight: 800;
    color: #39ff88;
}

.label {
    margin-top: 5px;
    color: #7f9486;
    font-size: 12px;
}

.search {
    width: 100%;
    padding: 13px;

    background: #060a07;
    border: 1px solid #285438;
    border-radius: 9px;

    color: white;
    outline: none;

    margin-bottom: 15px;
}

.results {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.result {
    background: #080e0a;
    border: 1px solid #1b3825;
    border-radius: 12px;
    padding: 16px;
}

.result-main {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.url {
    font-family: Consolas, monospace;
    word-break: break-all;
}

.badge {
    padding: 6px 11px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 800;
    white-space: nowrap;
}

.ok {
    color: #39ff88;
    background: rgba(57,255,136,.1);
}

.redirect {
    color: #ffd166;
    background: rgba(255,209,102,.1);
}

.bad {
    color: #ff7070;
    background: rgba(255,70,70,.1);
}

.unknown {
    color: #9bb5ff;
    background: rgba(100,130,255,.1);
}

.details {
    margin-top: 9px;
    color: #829487;
    font-size: 13px;
    line-height: 1.6;
    word-break: break-all;
}

.empty {
    padding: 35px;
    text-align: center;
    color: #697b6e;
}

.api-box {
    font-family: Consolas, monospace;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 8px;
    background: #060a07;
    border: 1px solid #1b3825;
    color: #8da493;
    word-break: break-all;
}

@media(max-width:700px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .result-main {
        flex-direction: column;
        align-items: flex-start;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🔗 LINK CHECKER</div>
    <div class="subtitle">
        Check real HTTP responses
    </div>
</header>

<div class="container">

    <div class="card">

        <h2>Check Links</h2>

        <textarea
            id="links"
            placeholder="Enter one URL per line

https://example.com
https://google.com
https://github.com"
        ></textarea>

        <div class="buttons">

            <button
                class="primary"
                id="checkButton"
                onclick="checkLinks()">
                Check Links
            </button>

            <button
                class="secondary"
                onclick="loadExample()">
                Example
            </button>

            <button
                class="secondary"
                onclick="clearAll()">
                Clear
            </button>

            <button
                class="secondary"
                onclick="exportResults()">
                Export JSON
            </button>

        </div>

        <div class="status" id="status">
            Ready.
        </div>

        <div class="progress" id="progress">
            <div
                class="progress-bar"
                id="progressBar">
            </div>
        </div>

    </div>


    <div class="card">

        <div class="stats">

            <div class="stat">
                <div class="number" id="total">0</div>
                <div class="label">TOTAL</div>
            </div>

            <div class="stat">
                <div class="number" id="successful">0</div>
                <div class="label">SUCCESS</div>
            </div>

            <div class="stat">
                <div class="number" id="redirects">0</div>
                <div class="label">REDIRECTS</div>
            </div>

            <div class="stat">
                <div class="number" id="failed">0</div>
                <div class="label">FAILED</div>
            </div>

        </div>

    </div>


    <div class="card">

        <h2>Results</h2>

        <input
            class="search"
            id="search"
            placeholder="Search checked URLs..."
            oninput="renderResults()"
        >

        <div
            class="results"
            id="results">

            <div class="empty">
                No links checked yet.
            </div>

        </div>

    </div>


    <div class="card">

        <h2>API Server</h2>

        <div class="api-box" id="apiDisplay"></div>

    </div>

</div>


<script>

/*
    =========================================================
    CHANGE THIS
    =========================================================

    If index.html and server.js are hosted together:

        const API_URL = "";

    If your Node server is somewhere else:

        const API_URL = "https://your-server.example.com";

*/

const API_URL = "";

const CHECK_ENDPOINT =
    API_URL + "/api/check";


let results = [];


/* Show API URL */

document.getElementById("apiDisplay").textContent =
    CHECK_ENDPOINT;


/* =========================================================
   CHECK LINKS
   ========================================================= */

async function checkLinks() {

    const textarea =
        document.getElementById("links");

    const button =
        document.getElementById("checkButton");

    const status =
        document.getElementById("status");

    const progress =
        document.getElementById("progress");

    const progressBar =
        document.getElementById("progressBar");

    const raw =
        textarea.value;

    const links = [
        ...new Set(
            raw
                .split(/\r?\n/)
                .map(x => x.trim())
                .filter(Boolean)
        )
    ];

    if (!links.length) {

        status.textContent =
            "Enter at least one URL.";

        return;
    }

    results = [];

    button.disabled = true;

    progress.style.display = "block";

    progressBar.style.width = "10%";

    status.textContent =
        `Checking ${links.length} link${links.length === 1 ? "" : "s"}...`;

    document.getElementById("results").innerHTML =
        `<div class="empty">Checking links...</div>`;

    try {

        const response = await fetch(
            CHECK_ENDPOINT,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    links: links
                })
            }
        );

        progressBar.style.width = "75%";

        if (!response.ok) {

            throw new Error(
                `Server returned HTTP ${response.status}`
            );
        }

        const data =
            await response.json();

        results =
            Array.isArray(data.results)
                ? data.results
                : [];

        progressBar.style.width = "100%";

        updateStats();

        renderResults();

        status.textContent =
            `Finished checking ${results.length} link${results.length === 1 ? "" : "s"}.`;

    }

    catch (error) {

        results = [];

        document.getElementById("results").innerHTML =
            `<div class="empty">
                ❌ ${escapeHTML(error.message)}
                <br><br>
                Make sure your Node server is running and that
                the API URL is correct.
            </div>`;

        status.textContent =
            "Unable to connect to the checker server.";

    }

    finally {

        button.disabled = false;

        setTimeout(() => {
            progress.style.display = "none";
            progressBar.style.width = "0%";
        }, 600);

    }
}


/* =========================================================
   STATS
   ========================================================= */

function updateStats() {

    const total =
        results.length;

    const successful =
        results.filter(
            r =>
                r.status >= 200 &&
                r.status < 300
        ).length;

    const redirects =
        results.filter(
            r =>
                r.status >= 300 &&
                r.status < 400
        ).length;

    const failed =
        results.filter(
            r =>
                !r.status ||
                r.status >= 400
        ).length;


    document.getElementById("total")
        .textContent = total;

    document.getElementById("successful")
        .textContent = successful;

    document.getElementById("redirects")
        .textContent = redirects;

    document.getElementById("failed")
        .textContent = failed;
}


/* =========================================================
   RESULTS
   ========================================================= */

function renderResults() {

    const container =
        document.getElementById("results");

    const search =
        document.getElementById("search")
            .value
            .toLowerCase()
            .trim();

    const filtered =
        results.filter(result =>
            String(result.url)
                .toLowerCase()
                .includes(search)
        );


    if (!filtered.length) {

        container.innerHTML =
            `<div class="empty">
                ${results.length
                    ? "No matching results."
                    : "No links checked yet."
                }
            </div>`;

        return;
    }


    container.innerHTML =
        filtered.map(result => {

            let className =
                "unknown";

            let label =
                "UNKNOWN";


            if (
                result.status >= 200 &&
                result.status < 300
            ) {

                className = "ok";

                label =
                    `${result.status} OK`;

            }

            else if (
                result.status >= 300 &&
                result.status < 400
            ) {

                className = "redirect";

                label =
                    `${result.status} REDIRECT`;

            }

            else if (
                result.status >= 400
            ) {

                className = "bad";

                label =
                    `${result.status} ${result.statusText || ""}`;

            }

            else if (result.error) {

                className = "bad";

                label = "FAILED";

            }


            const finalUrl =
                result.finalUrl &&
                result.finalUrl !== result.url
                    ? `<br>Final URL:
                       ${escapeHTML(result.finalUrl)}`
                    : "";


            return `

                <div class="result">

                    <div class="result-main">

                        <div class="url">
                            ${escapeHTML(result.url)}
                        </div>

                        <div class="badge ${className}">
                            ${escapeHTML(label)}
                        </div>

                    </div>

                    <div class="details">

                        ${
                            result.status
                                ? `HTTP ${result.status}
                                   ${escapeHTML(result.statusText || "")}`
                                : escapeHTML(
                                    result.error ||
                                    "Unknown error"
                                )
                        }

                        ${
                            result.responseTime != null
                                ? ` • ${result.responseTime} ms`
                                : ""
                        }

                        ${
                            result.redirected
                                ? " • Redirected"
                                : ""
                        }

                        ${finalUrl}

                    </div>

                </div>

            `;

        }).join("");
}


/* =========================================================
   EXAMPLE
   ========================================================= */

function loadExample() {

    document.getElementById("links").value =
`https://example.com
https://github.com
https://google.com
https://example.com/not-found
https://httpbin.org/status/404
https://httpbin.org/status/500`;

}


/* =========================================================
   CLEAR
   ========================================================= */

function clearAll() {

    results = [];

    document.getElementById("links")
        .value = "";

    document.getElementById("search")
        .value = "";

    document.getElementById("status")
        .textContent = "Ready.";

    updateStats();

    renderResults();
}


/* =========================================================
   EXPORT
   ========================================================= */

function exportResults() {

    if (!results.length) {

        alert("There are no results to export.");

        return;
    }

    const blob =
        new Blob(
            [JSON.stringify(results, null, 2)],
            {
                type: "application/json"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        "link-check-results.json";

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);
}


/* =========================================================
   HTML ESCAPING
   ========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
